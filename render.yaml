services:
  - type: web
    name: edushare-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
    disk:
      name: edushare-data
      mountPath: /opt/render/project/src
      sizeGB: 1
